---
# Deploys (or updates) task-manager on Kubernetes using the manifests in ../k8s/.
# Ansible fills in the image tag and version, applies the manifests, and waits
# until the new pod is running and ready.
#
# Called by the Jenkinsfile's "Deploy to EKS (Ansible)" stage:
#   ansible-playbook -i inventory.ini deploy.yml -e image=<registry/image:tag> -e app_version=<sha>

- name: Deploy task-manager to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    manifests: "{{ playbook_dir }}/../k8s"
    rollout_timeout: 300

  pre_tasks:
    - name: Check that the pipeline passed the image and version
      ansible.builtin.assert:
        that:
          - image is defined and image | length > 0
          - app_version is defined and app_version | string | length > 0
        fail_msg: "Pass -e image=... -e app_version=..."

  tasks:
    - name: Create namespace
      kubernetes.core.k8s:
        state: present
        template: "{{ manifests }}/namespace.yaml"

    - name: Apply Deployment with the new image and wait for the rollout
      kubernetes.core.k8s:
        state: present
        template: "{{ manifests }}/deployment.yaml"
        wait: true
        wait_timeout: "{{ rollout_timeout }}"

    - name: Apply Service (public LoadBalancer)
      kubernetes.core.k8s:
        state: present
        template: "{{ manifests }}/service.yaml"
