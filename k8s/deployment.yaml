# Kubernetes Deployment for the task-manager app.
#
# The image and app_version placeholders below are filled in by Ansible
# (ansible/deploy.yml) on every pipeline run: the ECR image tagged with the
# git commit, and that commit's short SHA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager
  namespace: task-manager
  labels:
    app: task-manager
spec:
  # Kept at 1: tasks are stored in memory, so each pod would have its own separate list.
  replicas: 1
  selector:
    matchLabels:
      app: task-manager
  # Zero-downtime rollout: start the new pod first, remove the old one only once
  # the new one passes its readiness check. If the new pod never becomes ready,
  # the old one keeps serving and the pipeline fails.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: task-manager
        version: "{{ app_version }}"
    spec:
      containers:
        - name: task-manager
          image: "{{ image }}"
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "{{ app_version }}"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              memory: 768Mi
          # Spring Boot can be slow to start; allow up to 3 minutes
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
