spring.application.name=task-manager

# Cloud Run / App Service / most PaaS inject PORT; default to 8080 locally
server.port=${PORT:8080}

# Set by the CI/CD pipeline (e.g. the git commit SHA); shown at /api/info
app.version=${APP_VERSION:local}

# Health endpoint for the cloud platform's health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
